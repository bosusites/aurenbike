<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Auren Racing Team</title>
  <meta name="theme-color" content="#3a0606">
  <link rel="preload" as="image" href="img/background.jpg">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      /* Dark red fallback while the image loads */
      background-color: #3a0606;
      background-image: url("img/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* iOS Safari ignores background-attachment: fixed, so use scroll there */
    @supports (-webkit-touch-callout: none) {
      body { background-attachment: scroll; }
    }

    main {
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .logo {
      display: block;
      width: min(70vw, 720px);
      height: auto;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.35));
    }
  </style>
</head>
<body>
  <main>
    <h1 style="margin:0">
      <img class="logo" src="img/logo.png" alt="Auren Racing Team" width="2000" height="642">
    </h1>
  </main>
</body>
</html>
